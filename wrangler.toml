name = "frostlink-ultimate-calculator"
main = "worker.js"
compatibility_date = "2026-11-24"
workers_dev = true
keep_vars = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[build]
command = "npm run build"
watch_dir = "src"
